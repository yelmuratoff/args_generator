name: args_generator
description: Page Args Generator - A code generator for Flutter page arguments
version: 1.3.0
homepage: https://github.com/yelmuratoff/args_generator
repository: https://github.com/yelmuratoff/args_generator

executables:
  args_generator:

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  build: ^4.0.9
  args: ^2.6.0
  collection: ^1.19.1
  args_generator_annotations: ^1.3.0
  glob: ^2.1.3
  meta: ^1.16.0
  source_gen: ^4.3.0
  analyzer: ">=14.0.0 <15.0.0"

dev_dependencies:
  build_runner: ^2.16.1
  lints: ^6.0.0
  test: ^1.26.2

dependency_overrides:
  args_generator_annotations:
    path: packages/args_annotations
